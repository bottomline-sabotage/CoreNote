<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Styles.css">
</head>
<body class="proper_body">
    <div style="user-select: none;" id="content">
        <h2>Google Chrome Hide 'n' Seek</h2>

        <div class="tab">
            <span class="tab_el" id="sign_in_menu_button">Sign In</span>
            <span class="tab_el" id="sign_up_menu_button">Create Account</span>
        </div>
    
        <div id="sign_in">
            <label for="in_username">Username: </label>
            <input id="in_username" placeholder="music stands">
        
            <br>
            <br>
            
            <label for="in_pass">Password:</label>
            <input id="in_pass" type="password" placeholder="cheatday321">
        
            <br>
        
            <button id="button-sign_in">Sign In</button>
            <br>
            <!-- <br> -->
        </div>

        <div id="sign_up">
            <div id="sign_up_content">
                <label for="up_username">Username: </label>
                <input id="up_username" placeholder="john smith">
            
                <br>
                <br>
    
                <label for="fullname">Full name: </label>
                <input id="fullname" placeholder="Tyler Owens">
            
                <br>
                <br>
                
                <label for="up_pass">Password:</label>
                <input id="up_pass" placeholder="catfish" type="password">
            
                <br>
                <br>

                <label for="up_pass">User color:</label>
                <input id="color" type="color">
            
                <br>
                <br>
    
                <input id="up_pfp" type="file" accept="image/png">
                <br>
                <label for="up_pfp" id="custom-file-label" class="custom-file-label">Import a Profile Picture</label>

            </div>
            
            <br>
        
            <button id="button-sign_up">Create Account</button>
            <br>
            <!-- <br> -->
        </div>
        
        <span id="preview"></span>

        <br>
        <br>

        <div style="flex-direction: row; align-items: center; justify-content: space-between;">
            <!-- <span><i style="color: rgb(201, 201, 201)">Bottomline Sabotage (Tyler Koberna), 2025</i></span> -->
            <span><i style="color: rgb(201, 201, 201)">Tyler Koberna, 2025</i></span>
        </div>

        <span style="position: fixed; bottom: 8px; right: 8px; font-size: 14px; cursor: pointer;" title="Reset" class="hide_on_dialogue_box" id="reset">❌</span>

    </div>

    <script src="Scripts/The Hell.js"></script>
    <script src="Scripts/Reset.js"></script>
    <script src="Scripts/ServerCommunicator.js"></script>
    <script src="Scripts/Accounts.js"></script>
    <script src="Scripts/SignIn.html.js"></script>
</body>
</html>
