<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One-Time Password</title>
    <link rel="stylesheet" href="/Styles.css">
    <style>
        body {
            background-color: #2c2c2c;
            color: white;
        }

        * {
            color: white;
        }

        .center-thing {
            width: 80vw;
            height: 50vh;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);   
        }

        .sec {
            text-align: center;
            font-size: 8vh;
            width: auto;
            padding: 5px;
            background-color: rgb(2, 48, 26);
            border-radius: 10px;
            border-color: rgb(0, 118, 16);
            border-style: solid;
            border-width: 3px;
            font-family: norwester, calibri, 'Gill Sans', 'Gill Sans MT', 'Trebuchet MS', sans-serif;
            transition: all 0.3s ease;
            z-index: 5;
            user-select: none;
            margin: 5px;
        }


        /* .sec:hover {
            transform: scale(1.1);
            background-color: rgb(0, 40, 8);
        } */

        .sec:hover {
            /* font-size: 1.7rem;/ */
            background-color: rgb(0, 142, 0);
            transform: scale(0.98);
            
        }
    </style>
</head>
<body>
    <div class="center-thing">
        <h1>Host/Teacher Password</h1>
        <span class="note">The password has been saved to your web browser.<br>However, if you plan on changing devices or sharing the server with other hosts, <i>you will need to know the password</i>.</span><br><br>
        <div style="display: flex; justify-content: center;">
            <div class="sec" id="one">I don't</div>
            <div class="sec" id="two">Remember</div>
            <div class="sec" id="three">It</div>
        </div><br><br>
        <button onclick="copy()" id="copioer">Copy Password</button>
        <br><br>
        <button onclick="window.location.href = '/Host/MainPage.html'">Go to CoreNote Live Host Panel</button><br>
        

    </div>
    <script>
        let p = `TRADE_SECRET`;
        if(p != `TRADE_SECRET`) {
            localStorage.setItem("live_host_tradeSecret", p);
        } else {
        }
        
        if(navigator.clipboard) {
            document.querySelector("#one").innerHTML = p.substring(0, 4);
    
            // document.querySelector("#one").innerHTML = s0 + p.substring(0, 1) + s1 + p.substring(1, 4);
            // document.querySelector("#two").innerHTML = s0 + p.substring(4, 5) + s1 + p.substring(5, 8);
            document.querySelector("#two").innerHTML = p.substring(4, 8);
            document.querySelector("#three").textContent = p.substring(8, 12);
    
            let lock = false;
            function copy() {
                if(lock)
                    return;
                lock = true;
                navigator.clipboard.writeText(p);
                document.querySelector("#copioer").textContent = "Copied"
                setTimeout(() => {
                    document.querySelector("#copioer").textContent = "Copy Password"
                    lock = false;
                }, 1500);
            }
        } else {
            document.querySelector("#copioer").style.display = "none";
            document.querySelector("#one").innerHTML = p;
            document.querySelector("#two").style.display = "none"
            document.querySelector("#three").style.display = "none"
        }

        
    </script>
</body>
</html>
