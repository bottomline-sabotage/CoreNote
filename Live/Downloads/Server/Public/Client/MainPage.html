<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One-Time Password</title>
    <link rel="stylesheet" href="/Styles.css">
    <style>
        body {
            background-color: #2c2c2c;
            color: white;
        }

        * {
            color: white;
        }

        .center-thing {
            min-width: 100vw;
            height: 50vh;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);   
        }

        .sec {
            text-align: center;
            font-size: 4vh;
            max-width: 24vw;
            padding: 5px;
            background-color: rgb(2, 48, 26);
            border-radius: 10px;
            border-color: rgb(0, 118, 16);
            border-style: solid;
            border-width: 3px;
            font-family: norwester, calibri, 'Gill Sans', 'Gill Sans MT', 'Trebuchet MS', sans-serif;
            transition: all 0.3s ease;
            z-index: 5;
            user-select: none;
            margin: 5px;
        }


        /* .sec:hover {
            transform: scale(1.1);
            background-color: rgb(0, 40, 8);
        } */

        .sec:hover {
            /* font-size: 1.7rem;/ */
            background-color: rgb(0, 142, 0);
            transform: scale(0.98);
            
        }

        .big-logo {
            max-height: 13vh;
            max-width: 90vw;
        }

        .grid {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(100%, 650px);
            padding: 20px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 18px;
            box-shadow: 0 20px 50px #0005;
            border-radius: 5px;
            transition: opacity 0.3s ease;
        }

        a {
            cursor: pointer;
        }

        #mainPage, #gameToken {
            display: none;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div style="position: fixed; top: 6vh; left: 5%; max-width: 20vw; ;" id="custom-username"></div>
    
    <img src="/Assets/Logo.png" class="big-logo" alt="CoreNote Live">
    
    <div style="position: fixed; bottom: 0.5vh; right: 50%; transform: translate(50%); "><a id="offline-online-switcherroo">I actually wanted an offline game</a></div>

    <div class="grid" id="gameToken">
        <h1>Enter your Game Token!</h1>
        <div style="display: flex; justify-content: center;">
            <input class="sec" id="one">
            <input class="sec" id="two">
            <input class="sec" id="three">
        </div>

        <br>
        
        <span style="font-size: 3vh; font-weight: bold;">And your Nickname!</span><br>
        <span class="note">Don't use your real name</span><br><br>
        <input style="font-size: 3vh;" id="account-creation-username">

        <br><br>
        <button id="account-creation-continue">Continue</button>
    </div> 

    <div id="mainPage" class="grid">TEST</div>

    <script src="/General.js"></script>
    <script>

        

        document.querySelector("#account-creation-continue").onclick = async () => {
            // If game token in storage and is different from current, reset (after verifying) via CoreNoteLive.clear

            const usernameBox = document.querySelector("#custom-username");
            let username = document.querySelector("#account-creation-username").value;
            usernameBox.innerHTML = `Hello, <a>${username}</a>!`;
            
            CoreNoteLive.storage.set("username", username);
            
            usernameBox.onclick = async () => {
                let res; 
                do {
                    res = await CoreNote.prompt("Change your username here", username);
                } while(!res);
                
                username = res;
                usernameBox.innerHTML = `Hello, <a>${username}</a>!`;
                CoreNoteLive.storage.set("username", username);
            }

    



            // Transition
            const mainPage = document.querySelector("#mainPage");
            const gameToken = document.querySelector("#gameToken");

            CoreNoteLive.elementTransition(gameToken, mainPage, 350);

            document.querySelector("#account-creation-continue").onclick = null;

        };
        
        // If already has a username in storage
        if(CoreNoteLive.storage.get("username")) {
            const eUsername = CoreNoteLive.storage.get("username");
            const usernameBox = document.querySelector("#custom-username");
            document.querySelector("#account-creation-username").value = eUsername;
        }

        const params = new URL(window.location.href).searchParams;
        if(params.get("online") == "true") {
            CoreNoteLive.storage.set("online", true);
            window.onlineGame = true;
            document.querySelector("#mainPage").style.display = "none";
            document.querySelector("#gameToken").style.display = "inline";
            document.querySelector("#offline-online-switcherroo").textContent = "I actually wanted an offline game";
            document.querySelector("#offline-online-switcherroo").onclick = () => {
                CoreNoteLive.storage.clear();
                window.location.href = `${String(window.location.href).replaceAll('?online=true', '')}`;
            };
        } else {
            CoreNoteLive.storage.set("online", false);
            window.onlineGame = false;
            document.querySelector("#gameToken").style.display = "none";
            document.querySelector("#mainPage").style.display = "inline";
            document.querySelector("#offline-online-switcherroo").textContent = "I actually wanted an online game";
            document.querySelector("#offline-online-switcherroo").onclick = () => {
                CoreNoteLive.storage.clear();
                window.location.href = `${window.location.href}?online=true`;
            };
        }
    </script>
    <script>
       
        const inputs = document.querySelectorAll(".sec");

        inputs.forEach((input, index) => {

            // Handle typing
            input.addEventListener("input", () => {
                input.value = input.value.substring(0, 4);

                if(input.value.length >= 4 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                    inputs[index + 1].select();
                }
            });

            // Handle paste across all inputs
            input.addEventListener("paste", (e) => {
                e.preventDefault();

                const pastedData = e.clipboardData
                    .getData("text")
                    .replace(/\s/g, "");

                let currentIndex = index;

                for(let i = 0; i < pastedData.length && currentIndex < inputs.length; i += 4) {
                    inputs[currentIndex].value = pastedData.substring(i, i + 4);
                    currentIndex++;
                }

                // Focus the last filled input
                const lastIndex = Math.min(
                    index + Math.ceil(pastedData.length / 4) - 1,
                    inputs.length - 1
                );

                inputs[lastIndex].focus();
                inputs[lastIndex].setSelectionRange(
                    inputs[lastIndex].value.length,
                    inputs[lastIndex].value.length
                );
            });

            // Keyboard navigation
            input.addEventListener("keydown", (e) => {

                if(e.key === "Backspace" && input.value === "" && index > 0) {
                    e.preventDefault();
                    inputs[index - 1].focus();
                    inputs[index - 1].setSelectionRange(
                        inputs[index - 1].value.length,
                        inputs[index - 1].value.length
                    );
                }

                if(e.key === "ArrowLeft" &&
                    index > 0 &&
                    input.selectionStart === 0) {
                    e.preventDefault();
                    inputs[index - 1].focus();
                    inputs[index - 1].setSelectionRange(
                        inputs[index - 1].value.length,
                        inputs[index - 1].value.length
                    );
                }

                if(e.key === "ArrowRight" &&
                    index < inputs.length - 1 &&
                    input.selectionStart === input.value.length) {
                    e.preventDefault();
                    inputs[index + 1].focus();
                    inputs[index + 1].setSelectionRange(0, 0);
                }
            });

        });

    </script>
</body>
</html>
